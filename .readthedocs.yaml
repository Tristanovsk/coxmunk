version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # ImageMagick converts the README GIF for the PDF/ePub builds (sphinx.ext.imgconverter)
  apt_packages:
    - imagemagick

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats: all

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
