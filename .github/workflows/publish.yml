name: Publish to PyPI

# Pushing a version tag (e.g. v1.2.1) publishes to PyPI; running the workflow by
# hand (Actions > Publish to PyPI > Run workflow) publishes to TestPyPI.
# Publication uses PyPI Trusted Publishing (OIDC): no API token is stored here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check that the tag matches the package version
      if: github.ref_type == 'tag'
      run: |
        version=$(grep -Po "__version__ = '\K[^']+" coxmunk/__init__.py)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match coxmunk.__version__ = $version"
          exit 1
        fi
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Test the built wheel
      env:
        MPLBACKEND: Agg
      run: |
        python -m pip install dist/*.whl pytest
        cd "$RUNNER_TEMP"
        coxmunk --version
        pytest "$GITHUB_WORKSPACE/tests"
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/coxmunk
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coxmunk
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
