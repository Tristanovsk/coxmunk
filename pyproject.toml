[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coxmunk"
dynamic = ["version"]
description = "Sunglint (Stokes vector) computation from the Cox-Munk wave slope statistics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "T. Harmel", email = "tristan.harmel@gmail.com" }]
requires-python = ">=3.9"
keywords = ["sunglint", "Cox-Munk", "sea surface", "ocean color", "remote sensing", "polarization", "wind speed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "matplotlib",
    "cmocean",
    "docopt",
]

[project.urls]
Homepage = "https://github.com/Tristanovsk/coxmunk"
Documentation = "https://coxmunk.readthedocs.io"
Repository = "https://github.com/Tristanovsk/coxmunk"
Issues = "https://github.com/Tristanovsk/coxmunk/issues"

[project.scripts]
coxmunk = "coxmunk.visu:main"

[tool.setuptools]
packages = ["coxmunk"]

[tool.setuptools.dynamic]
version = { attr = "coxmunk.__version__" }
